tosca_definitions_version: tosca_simple_yaml_1_3

node_types:
  ServerNode:
    derived_from: SoftwareComponent
    properties:
      notification_port:
        type: list
        entry_schema:
          type: integer


topology_template:
  node_templates:
    my_server:
      type: ServerNode
      properties:
        notification_port: [port]
